server.address=0.0.0.0
server.port=9090
spring.datasource.url=jdbc:mysql://localhost:3306/db_invexialab?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=dashboard_app
spring.datasource.password=contrasenia_segura_produccion
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Mostrar SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
# Configuración básica del pool de conexiones
spring.datasource.hikari.connection-timeout=20000  
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Asegúrate de controlar las transacciones manualmente si es necesario
spring.datasource.hikari.auto-commit=false
logging.file.name=/var/log/dashboard.log
