spring.application.name=dashboard
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
server.servlet.context-path=/dashboard/api/v1
spring.profiles.active=dev
# Límite tamaño maximo de archivos
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
# Evitar warning de Spring Security
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.root=INFO

app.upload.curso.dir=./src/main/resources/static/uploads/curso
